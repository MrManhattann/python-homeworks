<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Телефонна книга{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .navbar {
            margin-bottom: 30px;
        }

        .main-container {
            max-width: 1100px;
        }

        .card {
            border: none;
            border-radius: 12px;
        }

        .contact-card {
            transition: transform 0.2s;
        }

        .contact-card:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'contact_list' %}">
            📒 Телефонна книга
        </a>

        <a href="{% url 'contact_create' %}" class="btn btn-light">
            + Додати контакт
        </a>
    </div>
</nav>

<main class="container main-container mb-5">
    {% block content %}
    {% endblock %}
</main>

<footer class="text-center text-muted py-4">
    <p>Телефонна книга — Django Project</p>
</footer>

</body>
</html>
