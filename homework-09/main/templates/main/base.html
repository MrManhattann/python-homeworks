
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Вінниця{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar-brand {
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .main-content {
            min-height: 75vh;
        }

        .content-card {
            border: none;
            border-radius: 14px;
            overflow: hidden;
        }

        .section-title {
            color: #0d6efd;
            font-weight: 700;
        }

        .list-group-item {
            line-height: 1.6;
        }

        .card img {
            object-fit: cover;
        }

        footer {
            background-color: #212529;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand" href="{% url 'home' %}">
            Вінниця
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Відкрити меню"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">
                        Головна
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'news' %}">
                        Новини
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'management' %}">
                        Керівництво
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'facts' %}">
                        Факти
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'contacts' %}">
                        Контакти
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'history' %}">
                        Історія
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<main class="container py-5 main-content">

    {% block content %}
    {% endblock %}

</main>

<footer class="text-center py-4">
    <div class="container">
        <p class="mb-0">
            Інформаційний сайт міста Вінниця © 2026
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
