
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Домашня робота Django{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f3f6fa;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .main-container {
            max-width: 850px;
        }

        .content-card {
            border: none;
            border-radius: 16px;
        }

        .page-title {
            color: #0d6efd;
            font-weight: 700;
        }

        footer {
            margin-top: 60px;
            background: #212529;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand" href="{% url 'login' %}">
            Django Forms
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
            aria-controls="navbarMenu"
            aria-expanded="false"
            aria-label="Відкрити меню"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'login' %}">
                        Вхід
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'calculator' %}">
                        Калькулятор
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'registration' %}">
                        Реєстрація
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'programmer_day' %}">
                        День програміста
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<main class="container main-container py-5">

    {% block content %}
    {% endblock %}

</main>

<footer class="text-center py-4">
    <div class="container">
        <p class="mb-0">
            Навчальний Django-проєкт © 2026
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
